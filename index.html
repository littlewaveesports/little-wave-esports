<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITTLE WAVE ESPORTS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #080d18; color: white; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #111a2e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00d2ff; }
        .card { background: #1a2642; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #2a3b63; }
        .admin-link { display: block; text-align: center; margin-top: 20px; color: #00d2ff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Little Wave Esports</h2>
    <div class="card">
        <h3>Live Tournament Details</h3>
        <p><strong>Tournament:</strong> <span id="displayTourney">Loading...</span></p>
        <p><strong>Room ID:</strong> <span id="displayId">Not Updated</span></p>
        <p><strong>Password:</strong> <span id="displayPass">Not Updated</span></p>
    </div>
    <a href="admin.html" class="admin-link">Go to Admin Panel</a>
</div>

<script>
    document.getElementById('displayTourney').innerText = localStorage.getItem('tourneyName') || "No Active Tournament";
    document.getElementById('displayId').innerText = localStorage.getItem('roomID') || "Yet to be updated";
    document.getElementById('displayPass').innerText = localStorage.getItem('roomPass') || "Yet to be updated";
</script>

</body>
</html>
